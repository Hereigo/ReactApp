<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@16/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@16/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <style>
        #p1,
        #p2 {
            margin: 1em;
            padding: .5em 1em;
            border: 1px solid blue;
            max-width: 50%;
        }
    </style>
</head>

<body>

    <div id="p1"></div>

    <div id="p2"></div>


    <script type="text/babel">

        function Person(props) {
            return (
                <div className="person">
                    <h2>{props.name}</h2>
                    <p>Your Age: {props.age}</p>
                </div>
                // <div>Some Text</div> - Error !!! ALL elements must be inside ROOT <DIV> !!!
            );
        }

        ReactDOM.render(
            <Person name="Max" age="28" />,
            document.querySelector('#p1'));

        ////////////////////////////////////////////////////////////

        var group = (
            <div>
                <Person name="Jenny" age="18" />
                <Person name="Jessy" age="25" />
                <Person name="Mike" age="10" />
            </div>
        );

        ReactDOM.render(
            group,
            document.querySelector('#p2'));

    </script>
</body>

</html>
